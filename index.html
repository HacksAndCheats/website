<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">We've Moved</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #e0e0e0;
        }
        .lang-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }
        .lang-bar button {
            padding: 6px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: transparent;
            color: #888;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .lang-bar button:hover { border-color: #60a5fa; color: #60a5fa; }
        .lang-bar button.active { border-color: #2563eb; color: #fff; background: #2563eb; }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 24px;
            margin-top: 40px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }
        p {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 32px;
            color: #a0a0a0;
        }
        a {
            display: inline-block;
            padding: 14px 36px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            transition: background .2s;
        }
        a:hover { background: #1d4ed8; }
        .url { color: #60a5fa; word-break: break-all; }
        .redirect-msg { margin-top: 40px; font-size: .95rem; color: #666; }
    </style>
</head>
<body>
    <div class="lang-bar">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="fr">FR</button>
        <button data-lang="de">DE</button>
        <button data-lang="es">ES</button>
        <button data-lang="pt">PT</button>
        <button data-lang="it">IT</button>
        <button data-lang="nl">NL</button>
        <button data-lang="pl">PL</button>
        <button data-lang="ru">RU</button>
        <button data-lang="ar">AR</button>
        <button data-lang="ja">JA</button>
        <button data-lang="zh">ZH</button>
    </div>

    <div class="container">
        <h1 id="i18n-heading">🚀 We've Moved</h1>
        <p id="i18n-text">We've migrated to a brand new platform.<br>Find us now at:</p>
        <a href="https://hacksandcheats.netlify.app" target="_blank" rel="noopener noreferrer">
            https://hacksandcheats.vercel.app
        </a>
        <p class="redirect-msg" id="i18n-redirect">
            You will be redirected automatically in <span id="countdown">10</span> second(s)...
        </p>
    </div>

    <script>
        const translations = {
            en: {
                title: "We've Moved",
                heading: "🚀 We've Moved",
                text: "We've migrated to a brand new platform.<br>Find us now at:",
                redirect: "You will be redirected automatically in <span id=\"countdown\">10</span> second(s)..."
            },
            fr: {
                title: "Nous avons déménagé",
                heading: "🚀 Nouvelle adresse",
                text: "Nous avons migré vers une toute nouvelle plateforme.<br>Retrouvez-nous dès maintenant à l'adresse :",
                redirect: "Vous allez être redirigé automatiquement dans <span id=\"countdown\">10</span> seconde(s)..."
            },
            de: {
                title: "Wir sind umgezogen",
                heading: "🚀 Neue Adresse",
                text: "Wir sind auf eine brandneue Plattform umgezogen.<br>Besuchen Sie uns jetzt unter:",
                redirect: "Sie werden in <span id=\"countdown\">10</span> Sekunde(n) automatisch weitergeleitet..."
            },
            es: {
                title: "Nos hemos mudado",
                heading: "🚀 Nueva dirección",
                text: "Hemos migrado a una plataforma completamente nueva.<br>Encuéntranos ahora en:",
                redirect: "Serás redirigido automáticamente en <span id=\"countdown\">10</span> segundo(s)..."
            },
            pt: {
                title: "Mudamo-nos",
                heading: "🚀 Novo endereço",
                text: "Migrámos para uma nova plataforma.<br>Encontre-nos agora em:",
                redirect: "Será redirecionado automaticamente em <span id=\"countdown\">10</span> segundo(s)..."
            },
            it: {
                title: "Ci siamo trasferiti",
                heading: "🚀 Nuovo indirizzo",
                text: "Siamo migrati su una nuovissima piattaforma.<br>Trovaci ora all'indirizzo:",
                redirect: "Verrai reindirizzato automaticamente tra <span id=\"countdown\">10</span> secondo(i)..."
            },
            nl: {
                title: "We zijn verhuisd",
                heading: "🚀 Nieuw adres",
                text: "We zijn gemigreerd naar een gloednieuw platform.<br>Vind ons nu op:",
                redirect: "Je wordt automatisch doorgestuurd over <span id=\"countdown\">10</span> seconde(n)..."
            },
            pl: {
                title: "Przenieśliśmy się",
                heading: "🚀 Nowy adres",
                text: "Przenieśliśmy się na zupełnie nową platformę.<br>Znajdź nas teraz pod adresem:",
                redirect: "Za <span id=\"countdown\">10</span> sekund(y) nastąpi automatyczne przekierowanie..."
            },
            ru: {
                title: "Мы переехали",
                heading: "🚀 Новый адрес",
                text: "Мы переехали на совершенно новую платформу.<br>Теперь вы можете найти нас по адресу:",
                redirect: "Вы будете автоматически перенаправлены через <span id=\"countdown\">10</span> секунд..."
            },
            ar: {
                title: "لقد انتقلنا",
                heading: "🚀 عنوان جديد",
                text: "لقد انتقلنا إلى منصة جديدة كلياً.<br>يمكنك العثور علينا الآن على:",
                redirect: "سيتم إعادة توجيهك تلقائياً خلال <span id=\"countdown\">10</span> ثانية..."
            },
            ja: {
                title: "移転しました",
                heading: "🚀 新しいアドレス",
                text: "新しいプラットフォームに移転しました。<br>こちらからアクセスしてください：",
                redirect: "<span id=\"countdown\">10</span>秒後に自動的にリダイレクトされます..."
            },
            zh: {
                title: "我们搬家了",
                heading: "🚀 新地址",
                text: "我们已经迁移到一个全新的平台。<br>现在访问我们：",
                redirect: "将在 <span id=\"countdown\">10</span> 秒后自动跳转..."
            }
        };

        function setLang(lang) {
            const t = translations[lang] || translations.en;
            document.querySelector('html').lang = lang;
            document.title = t.title;
            document.getElementById('i18n-heading').textContent = t.heading;
            document.getElementById('i18n-text').innerHTML = t.text;
            document.getElementById('i18n-redirect').innerHTML = t.redirect;
            document.querySelectorAll('.lang-bar button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            const dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelector('html').dir = dir;
            localStorage.setItem('pref-lang', lang);
        }

        document.querySelectorAll('.lang-bar button').forEach(btn => {
            btn.addEventListener('click', () => setLang(btn.dataset.lang));
        });

        const saved = localStorage.getItem('pref-lang');
        if (saved && translations[saved]) {
            setLang(saved);
        } else {
            const browser = (navigator.language || navigator.language || '').slice(0, 2);
            if (translations[browser]) setLang(browser);
        }

        let seconds = 10;
        const el = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            if (el) el.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'https://hacksandcheats.vercell.app';
            }
        }, 1000);
    </script>
</body>
</html>
